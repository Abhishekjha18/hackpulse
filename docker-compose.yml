services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackpulse
      POSTGRES_PASSWORD: hackpulse_dev_only
      POSTGRES_DB: hackpulse
    ports:
      # Host port 5433 avoids clashing with a pre-existing local Postgres on
      # 5432. Containers on this compose network still reach it at
      # postgres:5432 (the service name), so this only affects host-side
      # tools (local `pnpm db:migrate`, psql, etc.).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
