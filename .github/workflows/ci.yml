name: CI

on:
  push:
  pull_request:

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @hackpulse/shared run lint
      - run: pnpm --filter @hackpulse/shared run typecheck
      - run: pnpm --filter @hackpulse/shared run build

      - run: pnpm --filter @hackpulse/web run lint
      - run: pnpm --filter @hackpulse/web run typecheck
      - run: pnpm --filter @hackpulse/web run build
